[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xscanner-agent"
version = "0.1.0"
description = "Local Linux diagnostic service for X-Scanner"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psutil>=6,<8", "send2trash>=1.8,<2", "Pillow>=13,<14"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
xscanner-agent = "xscanner.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xscanner*"]
exclude = ["tests*", "build*"]
